version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
      prefix: 'fix'
      include: 'scope'
  open-pull-requests-limit: 10
  groups:
    all-go-updates:
      patterns: ["*"]
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: 'fix'
    include: 'scope'
  open-pull-requests-limit: 10
  versioning-strategy: increase
  groups:
    all-npm-updates:
      patterns: ["*"]
